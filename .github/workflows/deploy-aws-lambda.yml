name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
      - cicd
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
  LAMBDA_FUNCTION_NAME: 'api-election'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production   # 使用此 Environment 的 variables/secrets；可改為 staging 等
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Build API docs
        run: npm run docs:build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::104840775722:role/github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: election/api-election
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile.lambda -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update Lambda Function
        env:
          NEW_IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          echo "Updating Lambda function: $LAMBDA_FUNCTION_NAME with image: $NEW_IMAGE"
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "$NEW_IMAGE" \
            --region "${{ env.AWS_REGION }}"
          
          echo "Waiting for Lambda function update to complete..."
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --region "${{ env.AWS_REGION }}"
          
          echo "Lambda function updated successfully!"


